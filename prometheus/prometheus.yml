
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - localhost:9090

  # Linux system metrics
  - job_name: node
    static_configs:
      - targets:
          - localhost:9100
